# ============================================================================
#  SonarQube Cloud — análisis desde el pipeline
# ----------------------------------------------------------------------------
#  El análisis automático de SonarQube Cloud nunca ejecuta las pruebas, así que
#  la cobertura no puede llegarle por esa vía. Este fichero lo lee el escáner
#  que corre en GitHub Actions, después de que las pruebas generan sus informes.
#
#  Para que funcione hay que apagar el análisis automático en SonarQube Cloud
#  (Administration > Analysis Method) y guardar el token en el secreto
#  SONAR_2 del repositorio.
# ============================================================================
sonar.projectKey=ocamilavillero09_reservas_gimnasio_udem
sonar.organization=ocamilavillero09
sonar.projectName=reservas_gimnasio_udem

# Se analiza todo el repositorio, igual que hacía el análisis automático, pero
# las pruebas se declaran aparte: un fichero no puede ser código y prueba a la vez.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,**/node_modules/**,frontend/dist/**,frontend/coverage/**,htmlcov/**,**/migrations/**

sonar.python.version=3.11

# Informes de cobertura que deja el trabajo de pruebas del pipeline.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# La cobertura se mide solo sobre los 18 requisitos funcionales de la entrega
# (RF01 a RF16, RF20 y RF21). Cuentan únicamente:
#   - backend/api: views.py, features.py, attendance.py y sus utilidades en db.py
#   - frontend/src/services/api.js: el cliente de esos mismos requisitos
# Fuera queda todo lo demás:
#   - la interfaz React (App.jsx y components/), que solo pinta pantallas
#   - Nousadas.py y Nousadas.js: RF17, RF18, RF19, RF22 y RF23, fuera de la entrega
#   - los scripts de mongosh, la infraestructura, las configuraciones de
#     herramientas y los puntos de arranque
sonar.coverage.exclusions=database/**,k8s/**,argocd/**,jenkins/**,observability/**,**/*.config.js,backend/manage.py,backend/gym_api/**,backend/api/urls.py,**/Nousadas.*,frontend/src/index.jsx,frontend/src/App.jsx,frontend/src/components/**,frontend/src/services/config.js
