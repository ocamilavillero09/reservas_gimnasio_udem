sonar.projectKey=reservas-gimnasio-udem
sonar.projectName=Reservas Gimnasio UDEM
sonar.projectVersion=1.0.0

sonar.sources=backend/api,frontend/src
sonar.tests=regression_testing/backend,regression_testing/frontend

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=\
**/__pycache__/**,\
**/*.pyc,\
frontend/node_modules/**,\
frontend/dist/**,\
frontend/coverage/**,\
regression_testing/**,\
Metricas/**,\
*.html,\
**/migrations/**

sonar.test.inclusions=\
regression_testing/backend/**/*.py,\
regression_testing/frontend/**/*.js,\
regression_testing/frontend/**/*.jsx

# No cuentan como código duplicado:
#   - las pruebas, que repiten a propósito la misma preparación en cada caso
#     (un caso por camino del diagrama de flujo);
#   - los scripts de métricas de rendimiento y los informes .html de la raíz,
#     que no son código de la aplicación.
# Se repiten aquí aunque ya estén en sonar.exclusions: si el análisis se
# lanza con otro sonar.sources, la duplicación sigue sin contarlos.
sonar.cpd.exclusions=\
regression_testing/**,\
tests/**,\
Metricas/**,\
*.html

sonar.coverage.exclusions=\
database/**,\
k8s/**,\
argocd/**,\
jenkins/**,\
observability/**,\
Metricas/**,\
**/*.config.js,\
backend/manage.py,\
backend/gym_api/**,\
backend/api/urls.py,\
**/Nousadas.*,\
frontend/src/index.jsx,\
frontend/src/App.jsx,\
frontend/src/components/Navbar.jsx,\
frontend/src/services/config.js

sonar.sourceEncoding=UTF-8