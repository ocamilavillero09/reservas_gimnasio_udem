# ============================================================================
#  SonarQube Cloud — análisis desde el pipeline
# ----------------------------------------------------------------------------
#  El análisis automático de SonarQube Cloud nunca ejecuta las pruebas, así que
#  la cobertura no puede llegarle por esa vía. Este fichero lo lee el escáner
#  que corre en GitHub Actions, después de que las pruebas generan sus informes.
#
#  Para que funcione hay que apagar el análisis automático en SonarQube Cloud
#  (Administration > Analysis Method) y guardar el token en el secreto
#  SONAR_TOKEN del repositorio.
# ============================================================================
sonar.projectKey=ocamilavillero09_reservas_gimnasio_udem
sonar.organization=ocamilavillero09
sonar.projectName=reservas_gimnasio_udem

# Se analiza todo el repositorio, igual que hacía el análisis automático, pero
# las pruebas se declaran aparte: un fichero no puede ser código y prueba a la vez.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,**/node_modules/**,frontend/dist/**,frontend/coverage/**,htmlcov/**,**/migrations/**

sonar.python.version=3.11

# Informes de cobertura que deja el trabajo de pruebas del pipeline.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Fuera del cálculo de cobertura queda lo que no es lógica de la aplicación:
# los scripts de mongosh, las configuraciones de herramientas y los puntos de
# arranque. Si contaran, bajarían el porcentaje sin que exista nada que probar.
sonar.coverage.exclusions=database/**,k8s/**,argocd/**,jenkins/**,observability/**,**/*.config.js,frontend/src/index.jsx,backend/manage.py,backend/gym_api/**
