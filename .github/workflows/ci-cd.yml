name: CI/CD

# Se ejecuta al hacer push a main (ignora cambios solo de manifiestos o docs
# para no entrar en bucle cuando el propio pipeline actualiza el tag en k8s/).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - '**.md'
  workflow_dispatch:

# Por defecto los trabajos solo leen el repositorio. El único que escribe es el
# de despliegue, que declara ese permiso por su cuenta.
permissions:
  contents: read

env:
  DOCKERHUB_USER: ocamilavillero09
  BACKEND_IMAGE: ocamilavillero09/gym-backend
  FRONTEND_IMAGE: ocamilavillero09/gym-frontend

jobs:
  # ── 1) Pruebas unitarias (backend + frontend) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      # Se lanza desde la raíz: ahí están tests/ y .coveragerc. Si se lanzara
      # desde backend/, coverage no encontraría su configuración y el informe
      # saldría vacío o midiendo dependencias que no son del proyecto.
      - name: Backend — pruebas unitarias + cobertura
        run: |
          # Desde el archivo de versiones resueltas, comprobando las huellas:
          # la canalización prueba exactamente las mismas versiones que se
          # instalan en la imagen.
          # --only-binary: ningún paquete ejecuta su script de instalación.
          pip install --require-hashes --only-binary :all: -r backend/requirements.lock.txt
          coverage run backend/manage.py test tests.backend -v 2
          coverage report
          # El mismo resultado en XML, que es lo que lee SonarQube Cloud.
          coverage xml

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Frontend — pruebas unitarias (Vitest) + cobertura
        working-directory: frontend
        run: |
          # --ignore-scripts: ninguna dependencia ejecuta código al instalarse.
          npm ci --ignore-scripts
          npm run test:coverage
          # Vitest escribe las rutas relativas a frontend/ (src/App.jsx), pero
          # SonarQube Cloud las busca desde la raíz del repositorio. Sin este
          # ajuste descarta la cobertura del frontend entera sin avisar.
          sed -i 's#^SF:src/#SF:frontend/src/#' coverage/lcov.info

      # Los informes pasan al trabajo de análisis. Si el análisis corriera aquí
      # mismo, un fallo de SonarQube Cloud tumbaría las pruebas y con ellas la
      # publicación de imágenes, aunque el código esté bien.
      - name: Guardar los informes de cobertura
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cobertura
          path: |
            coverage.xml
            frontend/coverage/lcov.info

  # ── 1b) Análisis de SonarQube Cloud con la cobertura de las pruebas ──
  #     Sustituye al análisis automático, que nunca ejecuta pruebas y por eso
  #     no puede mostrar cobertura. Requiere el secreto SONAR_2 y tener el
  #     análisis automático apagado en SonarQube Cloud.
  sonar:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Historia completa: SonarQube Cloud la usa para saber qué es código
          # nuevo y a quién atribuir cada línea.
          fetch-depth: 0
      - name: Recuperar los informes de cobertura
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: cobertura
      - name: Análisis de SonarQube Cloud
        # v5 ya no tiene soporte y tiene una vulnerabilidad conocida: el propio
        # escáner pide pasar a v6.
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602  # v6
        env:
          # El escáner espera la variable SONAR_TOKEN; el secreto del repositorio
          # se guardó con el nombre SONAR_2.
          SONAR_TOKEN: ${{ secrets.SONAR_2 }}

  # Nota: las pruebas E2E con Playwright (tests/e2e/) se ejecutan en local
  # (cd frontend && npm run test:e2e); no se incluyen en CI por estabilidad.

  # ── 2) Build + push de imágenes a Docker Hub (si pasan las pruebas unitarias) ──
  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Login en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ── 3) Entrega continua: actualiza el tag en k8s/ y lo commitea ──
  #     ArgoCD detecta el cambio y despliega esa imagen en minikube.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para commitear el nuevo tag en k8s/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar kustomize
        run: |
          # Versión fija y huella comprobada: si el archivo descargado no es el
          # publicado, sha256sum falla y el paso se detiene sin ejecutar nada.
          VERSION=v5.8.1
          SHA256=029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
          # --proto '=https': si la descarga redirige, solo sigue a direcciones
          # HTTPS. Sin esto, una redirección podría llevarla a una web insegura.
          curl -sSfL --proto '=https' --tlsv1.2 -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${VERSION}/kustomize_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Fijar el tag de la imagen al SHA del commit
        working-directory: k8s
        run: |
          kustomize edit set image ${{ env.BACKEND_IMAGE }}=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          kustomize edit set image ${{ env.FRONTEND_IMAGE }}=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Commit del manifiesto actualizado (lo toma ArgoCD)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "ci: despliega imágenes ${{ github.sha }} [skip ci]" || echo "sin cambios"
          git pull --rebase origin main
          git push origin HEAD:main
