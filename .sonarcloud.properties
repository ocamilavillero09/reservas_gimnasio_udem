# ============================================================================
#  SonarQube Cloud — análisis automático
# ----------------------------------------------------------------------------
#  El análisis automático de SonarQube Cloud (el que se lanza solo en cada push)
#  NO lee sonar-project.properties: solo lee este fichero. Ese otro lo usa el
#  escáner de Jenkins contra el SonarQube local.
#
#  El alcance tiene que ser el mismo en los dos. Si se cambia uno, se cambia
#  el otro.
#
#  El análisis automático nunca ejecuta las pruebas, así que no puede informar
#  cobertura: la cobertura la mide el pipeline de Jenkins.
# ============================================================================

# Código de la aplicación: el backend de la API y el frontend.
sonar.sources=backend/api,frontend/src
sonar.tests=regression_testing

sonar.exclusions=\
**/__pycache__/**,\
**/migrations/**

sonar.test.inclusions=\
regression_testing/backend/**/*.py,\
regression_testing/frontend/**/*.js,\
regression_testing/frontend/**/*.jsx

# Las pruebas repiten a propósito la misma preparación en cada caso (un caso
# por camino del diagrama de flujo): no cuentan como código duplicado.
sonar.cpd.exclusions=regression_testing/**

sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
